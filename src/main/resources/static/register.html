<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Member Registration</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="registration-container">

    <h1>Church Member Registration</h1>

    <p>Create your church member account</p>

    <form id="registrationForm">

        <label>First Name</label>

        <input
            type="text"
            id="firstName"
            required
        >

        <label>Last Name</label>

        <input
            type="text"
            id="lastName"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >

        <label>Phone Number</label>

        <input
            type="text"
            id="phone"
            required
        >

        <label>Address</label>

        <input
            type="text"
            id="address"
            required
        >

        <label>Username</label>

        <input
            type="text"
            id="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            required
        >

        <button type="submit">
            Register
        </button>

        <p id="message"></p>

    </form>

    <p>
        Already have an account?
        <a href="/login.html">Login</a>
    </p>

</div>

<script src="js/register.js"></script>

</body>

</html>
