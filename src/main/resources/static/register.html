<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Member Registration | Church Management System</title>

    <link rel="stylesheet"
          href="/css/register.css">

</head>

<body>

<div class="registration-page">

    <div class="registration-card">

        <!-- Header -->

        <div class="registration-icon">
            ⛪
        </div>

        <div class="registration-header">

            <h1>Church Member Registration</h1>

            <p>Create your church member account</p>

        </div>

        <div class="divider"></div>


        <!-- Form introduction -->

        <div class="form-intro">

            <h2>Create Your Account</h2>

            <p>
                Enter your details below to join the church member portal.
            </p>

        </div>


        <form id="registrationForm">

            <!-- Personal Information -->

            <div class="section-title">
                <span>1</span>
                Personal Information
            </div>

            <div class="form-grid">

                <div class="input-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter your first name"
                        required>

                </div>


                <div class="input-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter your last name"
                        required>

                </div>


                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="input-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter your phone number"
                        required>

                </div>


                <div class="input-group full-width">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter your address"
                        required>

                </div>

            </div>


            <!-- Account Information -->

            <div class="section-title account-section-title">
                <span>2</span>
                Account Information
            </div>

            <div class="form-grid">

                <div class="input-group full-width">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required>

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>

                </div>

            </div>


            <!-- Register button -->

            <button type="submit" class="register-button">

                <span>Create Account</span>

                <span class="button-arrow">→</span>

            </button>


            <!-- Message -->

            <p id="message"></p>

        </form>


        <!-- Login -->

        <div class="login-section">

            <p>
                Already have a member account?
            </p>

            <a href="/member-login.html">
                Login to your account
            </a>

        </div>


        <!-- Back home -->

        <a href="/index.html" class="back-home">
            ← Back to Main Page
        </a>

    </div>

</div>


<script src="/js/register.js"></script>

</body>

</html>
