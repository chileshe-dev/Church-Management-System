
<!DOCTYPE html>
<html>
<head>
    <title>Contributions</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Contribution Management</h1>

<h2>Add Contribution</h2>

<form id="contributionForm">

    <input type="hidden" id="contributionId">

    <input type="text"
           id="contributionType"
           placeholder="Contribution Type"
           required>

    <input type="number"
           id="amount"
           placeholder="Amount"
           step="0.01"
           required>

    <input type="date"
           id="contributionDate"
           required>

    <input type="number"
           id="memberId"
           placeholder="Member ID"
           required>

    <button type="submit">
        Save Contribution
    </button>

</form>

<hr>

<h2>Contribution List</h2>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Member ID</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody id="contributionTable">
    </tbody>

</table>

<script src="js/contributions.js"></script>

</body>
</html>
